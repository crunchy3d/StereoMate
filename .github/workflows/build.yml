# StereoMate: builds the desktop program (Windows, Linux) and the web version from the project zip
# (exactly ONE .zip file in the repository root, e.g. StereoMate-tauri.zip).
#  - upload of a new zip (push to "main") or the "Run workflow" button: files under Actions → the run → "Artifacts";
#    when the repository is public, the web version is also published on GitHub Pages
#  - a published release: all files are attached to the release
# Changes of README, LICENSE and other texts do not start a build.
name: Build StereoMate

on:
  push:
    branches: [main]
    paths: ['*.zip', '.github/workflows/**', 'web/**', 'docs/screenshots/**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Unpack the project
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -ne 1 ]; then echo "::error::The repository must contain exactly one .zip file (found ${#zips[@]}: ${zips[*]})"; exit 1; fi
          echo "Project: ${zips[0]}"
          mkdir -p _project && cd _project
          if command -v unzip > /dev/null; then unzip -q -o "../${zips[0]}"; else 7z x -y "../${zips[0]}" > /dev/null; fi
          dir=$(dirname "$(ls -d */src-tauri | head -1)")
          echo "PROJ=_project/$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Build
        run: |
          cd "$PROJ"
          npm ci
          npx tauri build

      - name: Collect the files
        run: |
          cd "$PROJ"
          mkdir -p out
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          N=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          B=$(node -p "require('./src-tauri/tauri.conf.json').mainBinaryName")
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "src-tauri/target/release/$B.exe" "out/${N}_${V}_portable.exe"
            cp src-tauri/target/release/bundle/nsis/*.exe out/
            cp src-tauri/target/release/bundle/msi/*.msi out/
          else
            cp src-tauri/target/release/bundle/deb/*.deb out/
            cp src-tauri/target/release/bundle/appimage/*.AppImage out/
          fi
          ls -l out
          mv out "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}
          path: out/*

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: out/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Unpack the project
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -ne 1 ]; then echo "::error::The repository must contain exactly one .zip file"; exit 1; fi
          mkdir -p _project && cd _project && unzip -q -o "../${zips[0]}"
          dir=$(dirname "$(ls -d */src-tauri | head -1)")
          echo "PROJ=_project/$dir" >> "$GITHUB_ENV"

      - name: Web version (zip for the release, site for GitHub Pages)
        run: |
          V=$(node -p "require('./$PROJ/src-tauri/tauri.conf.json').version")
          D="$PROJ/dist"
          # zip: StereoMate.html + opencv.js (must stay together) + licences
          W="_web/StereoMate_web_$V"; mkdir -p "$W" out
          cp "$D/index.html" "$W/StereoMate.html"; cp "$D/opencv.js" "$D/opencv-LICENSE.txt" "$W/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$W/" 2>/dev/null || true
          printf 'StereoMate web version %s\r\n\r\nOpen StereoMate.html in Chrome or Edge (on a computer).\r\nKeep opencv.js in the same folder.\r\nThe desktop program (Windows / Linux) has more capabilities:\r\nhttps://github.com/crunchy3d/StereoMate/releases/latest\r\n' "$V" > "$W/README.txt"
          (cd _web && zip -q -r "../out/StereoMate_web_$V.zip" "StereoMate_web_$V")
          # site: start page with the notes, the program in app/
          mkdir -p site/app site/screenshots
          cp web/index.html site/index.html
          cp "$D/index.html" site/app/index.html; cp "$D/opencv.js" "$D/opencv-LICENSE.txt" site/app/
          cp docs/screenshots/*.jpg site/screenshots/ 2>/dev/null || true
          sed -i "s/__VERSION__/$V/g" site/index.html
          ls -l out site site/app

      - uses: actions/upload-artifact@v6
        with:
          name: Web
          path: out/*

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: out/*

      - name: Prepare GitHub Pages
        if: github.event.repository.private == false && github.event_name != 'release'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    # only for a public repository (GitHub Pages of private repositories needs a paid plan),
    # and not for releases (Pages may only be published from the main branch)
    needs: web
    if: github.event.repository.private == false && github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
